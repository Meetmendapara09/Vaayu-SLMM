[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaayu"
version = "1.1.0"
description = "Vaayu: 245M & 492M Small Language Model (SLM) for Machine-to-Machine Tool Calling with Native MCP"
readme = "README_PYPI.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Meet Mendapara"}
]
keywords = ["slm", "tlm", "tool-language-model", "mcp", "tool-calling", "agent", "pytorch", "transformers"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "huggingface_hub>=0.23.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0"
]

[project.urls]
"Homepage" = "https://github.com/Meetmendapara09/Vaayu-SLMM"
"Repository" = "https://github.com/Meetmendapara09/Vaayu-SLMM"
"Documentation" = "https://github.com/Meetmendapara09/Vaayu-SLMM/tree/main/@docs"
"Hugging Face (Vaayu-Base)" = "https://huggingface.co/meetmendapara/Vaayu-Base"
"Hugging Face (Vaayu-Large)" = "https://huggingface.co/meetmendapara/Vaayu-Large"
"Bug Tracker" = "https://github.com/Meetmendapara09/Vaayu-SLMM/issues"

[project.scripts]
vaayu = "vaayu.cli:main"

[tool.setuptools.packages.find]
include = ["vaayu*"]

[tool.setuptools.package-data]
vaayu = ["tokenizer/*", "model/*"]